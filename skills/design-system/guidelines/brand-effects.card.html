<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:#fff}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:56px}.lbl{font-family:var(--font-sans);font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5}.nm{font-family:var(--font-sans);font-size:12px;color:var(--text-ink);font-weight:500}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end;font-family:var(--font-sans);font-size:11px;color:var(--text-muted);text-align:center">
<div><div style="width:110px;height:70px;background:var(--gray-100)"></div>0 default</div>
<div><div style="width:110px;height:70px;background:var(--gray-100);border-radius:2px"></div>2px sm</div>
<div><div style="width:110px;height:70px;background:var(--gray-100);border-radius:6px"></div>6px md</div>
<div><div style="width:110px;height:70px;background:#fff;border-radius:10px;box-shadow:var(--shadow-modal)"></div>10px + --shadow-modal</div>
<div><div style="width:70px;height:70px;background:var(--orange-300);border-radius:50%"></div>50% dot</div></div>
<div class="lbl">No blur, no glass, no gradient anywhere on the site. Type over imagery gets --text-shadow-over-image instead of a scrim.</div></body></html>
