<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:#fff}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{width:104px}.box{height:56px}.lbl{font-family:var(--font-sans);font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5}.nm{font-family:var(--font-sans);font-size:12px;color:var(--text-ink);font-weight:500}</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:#ffffff;border:1px solid var(--border-hairline)"></div><div class="lbl"><span class="nm">--white</span><br>#ffffff</div></div><div class="chip"><div class="box" style="background:#f5f6f7;border:1px solid var(--border-hairline)"></div><div class="lbl"><span class="nm">--surface-alt</span><br>#f5f6f7</div></div><div class="chip"><div class="box" style="background:#f2f2f2;border:1px solid var(--border-hairline)"></div><div class="lbl"><span class="nm">--gray-100</span><br>#f2f2f2</div></div><div class="chip"><div class="box" style="background:#eeeeee;border:1px solid var(--border-hairline)"></div><div class="lbl"><span class="nm">--gray-200</span><br>#eeeeee</div></div><div class="chip"><div class="box" style="background:#333333;"></div><div class="lbl"><span class="nm">--gray-700</span><br>#333333</div></div><div class="chip"><div class="box" style="background:#222222;"></div><div class="lbl"><span class="nm">--gray-800</span><br>#222222</div></div></div></body></html>
